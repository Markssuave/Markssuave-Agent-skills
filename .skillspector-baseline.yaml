# SkillSpector Baseline for Verified False Positives Across Global Skills
version: "1.0"
rules:
  - rule_id: "AS1"
    path: "*SKILL.md"
    reason: "Built-in Antigravity customization skills legitimately document ~/.gemini/config and ~/.claude/settings.json."
  - rule_id: "AS3"
    path: "*CLAUDE.md"
    reason: "Caveman documentation legitimately references its own skill path."
  - rule_id: "AE1"
    path: "*SKILL.md"
    reason: "Large reference files in ui-master, taste-skill, agent-customize, and agent-ui-panel exceed per-reference static preview bounds."
  - rule_id: "LP3"
    path: "*SKILL.md"
    reason: "Antigravity and Codex skills use host permission gates rather than frontmatter allowed-tools lists."
  - rule_id: "*"
    path: "data/*.csv"
    reason: "ui-ux-pro-max CSV tables are static design/UX lookup rows, not executable instructions."
  - rule_id: "*"
    path: "data/stacks/*.csv"
    reason: "ui-ux-pro-max stack CSV rows contain framework CLI examples (npx shadcn, .env.local), not active payloads."
  - rule_id: "*"
    path: "library/*.json"
    reason: "taste-skill curated photo/site metadata JSON ('curl of a breaking teal wave', 'keychain')."
  - rule_id: "TM1"
    path: "scripts/block-dangerous-git.sh"
    reason: "ops-guardrails matches dangerous git flags (git reset --hard) specifically to block them."
  - rule_id: "*"
    path: "scripts/live-browser.js"
    reason: "ui-master localhost preview server communicates over 127.0.0.1 loopback only."
  - rule_id: "*"
    path: "scripts/compress.py"
    reason: "docs-compress CLI intentionally calls LLM APIs and excludes secret files when invoked manually."
  - rule_id: "PE3"
    path: "scripts/detect.py"
    reason: "docs-compress detect.py lists .env and credential filenames in an exclusion blocklist so they are never compressed."
  - rule_id: "*"
    path: "*AI-AND-LLM.md"
    reason: "Cloudflare security-audit playbook describing LLM memory manipulation attack classes to hunt for."
  - rule_id: "*"
    path: "*ATTACK-CLASSES.md"
    reason: "Cloudflare security-audit playbook describing credential and attack classes to hunt for."
  - rule_id: "*"
    path: "*DESKTOP-MOBILE-AND-LOCAL-IPC.md"
    reason: "Cloudflare security-audit playbook describing desktop/IPC attack classes to hunt for."
